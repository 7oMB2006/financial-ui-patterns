<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Financial UI Patterns</title>
  <desc id="desc">A dark financial interface illustration showing color semantics and collision-aware endpoint labels.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10131b"/><stop offset="1" stop-color="#07090e"/></linearGradient>
    <linearGradient id="rise" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb9ba0"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9ce8c7"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <clipPath id="chartClip"><rect x="690" y="65" width="438" height="230" rx="16"/></clipPath>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#surface)"/>
  <g id="title-block" transform="translate(58 54)">
    <rect width="154" height="30" rx="15" fill="#f7c869" fill-opacity=".13" stroke="#f7c869" stroke-opacity=".46"/>
    <text x="16" y="20" fill="#f7c869" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="1.2">PERSONAL PRACTICE</text>
    <text x="0" y="92" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="52" font-weight="700">Financial UI</text>
    <text x="0" y="148" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="52" font-weight="700">Patterns</text>
    <text x="0" y="196" fill="#a8b2c2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">Design decisions for market data interfaces,</text>
    <text x="0" y="224" fill="#a8b2c2" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">distilled into reusable Codex skills.</text>
    <g transform="translate(0 280)">
      <circle cx="8" cy="0" r="6" fill="#ef4444"/><text x="22" y="6" fill="#d9e0ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">VALUE SEMANTICS</text>
      <circle cx="226" cy="0" r="6" fill="#8c79e6"/><text x="240" y="6" fill="#d9e0ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">LABEL LAYOUT</text>
    </g>
  </g>
  <g id="chart-proof">
    <rect x="680" y="54" width="458" height="252" rx="18" fill="#0b0f17" stroke="#ffffff" stroke-opacity=".12"/>
    <g clip-path="url(#chartClip)">
      <path d="M710 110H905M710 160H905M710 210H905M710 260H905" stroke="#93a4bb" stroke-opacity=".13" stroke-dasharray="4 9"/>
      <path d="M720 254 C752 236 770 247 798 218 S838 176 867 191 S888 126 900 105" fill="none" stroke="url(#rise)" stroke-width="5" stroke-linecap="round"/>
      <path d="M720 142 C751 135 780 154 811 144 S850 119 872 135 S886 115 900 119" fill="none" stroke="url(#fall)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="900" cy="105" r="6" fill="#ef4444" stroke="#0b0f17" stroke-width="3"/><circle cx="900" cy="119" r="6" fill="#10b981" stroke="#0b0f17" stroke-width="3"/>
      <path d="M900 105H922" stroke="#ef4444" stroke-width="2"/><path d="M900 119H914L922 154" stroke="#10b981" stroke-width="2" fill="none"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
      <rect x="930" y="88" width="170" height="34" rx="8" fill="#31181c" stroke="#ef4444" stroke-opacity=".42"/><text x="943" y="110" fill="#ff9ba2" font-size="16" font-weight="700">+3.8%</text>
      <rect x="930" y="137" width="170" height="34" rx="8" fill="#0c2923" stroke="#10b981" stroke-opacity=".42"/><text x="943" y="159" fill="#8de0c0" font-size="16" font-weight="700">-1.2%</text>
      <text x="714" y="84" fill="#91a0b5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="1">ENDPOINT BEHAVIOR</text>
    </g>
  </g>
  <text x="1145" y="336" text-anchor="end" fill="#78859a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">SKILLS / UI / FINANCE</text>
</svg>